<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  :root {
    --road-dur: 0.62s;
    --cloud-dur: 30s;
    --bob-dur: 1.15s;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 26px 20px;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #e8eef7;
    background:
      radial-gradient(1200px 620px at 50% -12%, #24344f 0%, #0d1420 58%, #070b12 100%);
  }

  .card {
    width: min(960px, 100%);
    background: #0f1826;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 22px;
    padding: 18px 18px 14px;
    box-shadow: 0 30px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
  }

  .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 2px 6px 13px;
  }

  h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .3px;
  }
  h1 em {
    font-style: normal;
    color: #7fa9ff;
  }

  .hint { font-size: 12px; color: #7d8ba1; }

  .stage {
    border-radius: 16px;
    overflow: hidden;
    line-height: 0;
    background: #bfe6ff;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .stage svg { display: block; width: 100%; height: auto; }

  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 14px 6px 6px;
  }

  .btn {
    border: 1px solid rgba(255,255,255,.14);
    background: linear-gradient(180deg, #22314a, #18233a);
    color: #dfe9f8;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    padding: 9px 17px;
    border-radius: 10px;
    cursor: pointer;
    transition: background .18s, transform .08s;
  }
  .btn:hover { background: linear-gradient(180deg, #2b3d5c, #1d2b45); }
  .btn:active { transform: translateY(1px); }

  .slider {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: #93a2b8;
    margin-left: auto;
  }
  .slider b {
    color: #cfe0ff;
    font-variant-numeric: tabular-nums;
    min-width: 46px;
    display: inline-block;
  }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 156px;
    height: 4px;
    border-radius: 99px;
    background: #2a3a54;
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #4f8cff;
    border: 2px solid #0f1826;
    box-shadow: 0 0 0 3px rgba(79,140,255,.22);
  }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #4f8cff;
    border: 2px solid #0f1826;
  }

  .foot {
    padding: 10px 6px 2px;
    font-size: 12px;
    line-height: 1.7;
    color: #6f7d92;
  }
  .foot code {
    color: #8fb4ff;
    font-size: 11.5px;
  }

  /* ============ 通用背景动画 ============ */
  .road-dash { animation: roadMove var(--road-dur) linear infinite; }

  @keyframes roadMove {
    from { transform: translateX(0); }
    to   { transform: translateX(-160px); }   /* 160 = 70 + 90，正好一个虚线周期 */
  }

  .cloud-layer { animation: cloudMove var(--cloud-dur) linear infinite; }

  @keyframes cloudMove {
    from { transform: translateX(0); }
    to   { transform: translateX(-400px); }
  }

  .sun {
    transform-box: fill-box;
    transform-origin: center;
    animation: sunPulse 4.4s ease-in-out infinite;
  }
  @keyframes sunPulse {
    0%, 100% { transform: scale(1);    opacity: .95; }
    50%      { transform: scale(1.09); opacity: 1; }
  }

  .speedlines {
    animation: blink 1.15s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes blink {
    0%, 100% { opacity: .16; transform: translateX(6px); }
    50%      { opacity: .55; transform: translateX(0); }
  }

  .shadow {
    transform-box: fill-box;
    transform-origin: center;
    animation: shadowPulse var(--bob-dur) ease-in-out infinite;
  }
  @keyframes shadowPulse {
    0%, 100% { transform: scaleX(1);   opacity: .26; }
    50%      { transform: scaleX(.95); opacity: .20; }
  }

  .puff {
    transform-box: fill-box;
    transform-origin: center;
    animation: puffUp var(--bob-dur) linear infinite;
  }
  @keyframes puffUp {
    0%   { opacity: 0;   transform: translate(0, 8px) scale(.55); }
    30%  { opacity: .5; }
    100% { opacity: 0;   transform: translate(-46px, -28px) scale(1.6); }
  }

  /* 暂停：同时冻结 JS 与 CSS 动画 */
  body.paused .road-dash,
  body.paused .cloud-layer,
  body.paused .sun,
  body.paused .speedlines,
  body.paused .shadow,
  body.paused .puff { animation-play-state: paused; }
</style>
</head>
<body>
<div class="card">

  <div class="head">
    <h1>鹈鹕骑自行车 · <em>SVG 2D 动画</em></h1>
    <span class="hint">车轮旋转 · 曲柄转动 · 双腿 IK 跟随踏板 · 身体起伏</span>
  </div>

  <div class="stage">
    <svg id="scene" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg"
         role="img" aria-label="一只鹈鹕骑着自行车向前骑行的循环动画">
      <defs>

            <line x1="28" y1="-68" x2="-28" y2="68"/>

      <!-- 车架 -->

        <line x1="338" y1="312" x2="526" y2="298"/>
        <line x1="400" y1="430" x2="524" y2="300"/>
        <line x1="230" y1="430" x2="400" y2="430"/>
        <line x1="230" y1="430" x2="340" y2="310"/>

        <!-- 脖子 -->

        <!-- 头 -->

        <!-- 喉囊 -->

        <path d="M490 168 C 512 196 552 198 584 176" fill="none"

        <!-- 喉囊里的小鱼 -->

        <path d="M518 176 L542 166" fill="none" stroke="#8fa0b2" stroke-width="2"/>

        <!-- 上喙 -->

      <!-- 近侧曲柄 + 踏板 -->

            fill="#33383f" transform="translate(426 430)"/>

      <!-- 近侧腿 + 蹼足 -->

        <path id="nearLeg" d="" fill="none" stroke="#f4891f" stroke-width="13"
              stroke-linecap="round" stroke-linejoin="round"/>
        <g id="nearFoot" transform="translate(426 430)">

                fill="#ffab2e" stroke="#e08610" stroke-width="2"/>

  <div class="controls">
    <button class="btn" id="toggle" type="button">⏸ 暂停</button>

    <label class="slider">
      速度 <input id="speed" type="range" min="0.25" max="2" step="0.05" value="1">
      <b id="speedVal">1.00×</b>
    </label>
  </div>

  <div class="foot">
    腿部由逆向运动学（IK）逐帧求解：髋关节 — 膝关节 — 踏板，因此双脚始终贴合旋转中的踏板；车轮转速为踏频的固定齿比（2.4×）。
    背景虚线位移与云层漂移用 CSS 关键帧，周期与踩踏同步。
  </div>
</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  var el = {
    pelican:   $('pelican'),
    rearWheel: $('rearWheel'),
    frontWheel:$('frontWheel'),
    crankNear: $('crankNear'),
    crankFar:  $('crankFar'),
    nearPedal: $('nearPedal'),
    farPedal:  $('farPedal'),
    nearLeg:   $('nearLeg'),
    farLeg:    $('farLeg'),
    nearFoot:  $('nearFoot'),
    farFoot:   $('farFoot')
  };

  // ---- 骑行几何参数 ----
  var C  = { x: 400, y: 430 };          // 五通（曲柄中心）
  var R  = 26;                          // 曲柄长度
  var L1 = 96, L2 = 96;                 // 大腿 / 小腿
  var HIP_N = { x: 336, y: 294 };       // 近侧髋关节
  var HIP_F = { x: 330, y: 290 };       // 远侧髋关节
  var GEAR   = 2.4;                     // 齿比（车轮比曲柄）
  var PERIOD = 1.15;                    // 踩踏一圈秒数
  var DEG    = 180 / Math.PI;

  // ---- 状态 ----
  var theta = 0;
  var running = true;
  var speed = 1;
  var last = performance.now();

  var root = document.documentElement;
  var btnToggle = $('toggle');
  var btnReset  = $('reset');
  var range     = $('speed');
  var speedVal  = $('speedVal');

  /** 两段骨骼 IK：求膝盖位置（膝盖朝前） */
  function ik(H, P) {
    var dx = P.x - H.x;
    var dy = P.y - H.y;
    var raw = Math.hypot(dx, dy) || 1e-6;

    var dMin = Math.abs(L2 - L1) + 1;
    var dMax = L1 + L2 - 1;
    var d = Math.max(dMin, Math.min(dMax, raw));

    var ux = dx / raw, uy = dy / raw;
    var a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, L1 * L1 - a * a));

    var mx = H.x + ux * a, my = H.y + uy * a;
    var k1 = { x: mx - uy * h, y: my + ux * h };
    var k2 = { x: mx + uy * h, y: my - ux * h };

    return (k2.x >= k1.x) ? k2 : k1;   // 取靠前的一侧，膝盖朝车头方向
  }

  function legPath(H, K, P) {
    return 'M' + H.x.toFixed(1) + ',' + H.y.toFixed(1) +
           ' L' + K.x.toFixed(1) + ',' + K.y.toFixed(1) +
           ' L' + P.x.toFixed(1) + ',' + (P.y - 4).toFixed(1);
  }

  function render() {
    var deg = theta * DEG;

    // 身体起伏：每圈两次（左右脚各蹬一下）
    var bob = 3.5 * Math.sin(2 * theta);
    el.pelican.setAttribute('transform', 'translate(0 ' + bob.toFixed(2) + ')');

    // 踏板位置
    var cosT = Math.cos(theta), sinT = Math.sin(theta);
    var Pn = { x: C.x + R * cosT, y: C.y + R * sinT };
    var Pf = { x: C.x - R * cosT, y: C.y - R * sinT };

    // 髋关节（跟随身体起伏）
    var Hn = { x: HIP_N.x, y: HIP_N.y + bob };
    var Hf = { x: HIP_F.x, y: HIP_F.y + bob };

    var Kn = ik(Hn, Pn);
    var Kf = ik(Hf, Pf);

    el.nearLeg.setAttribute('d', legPath(Hn, Kn, Pn));
    el.farLeg.setAttribute('d',  legPath(Hf, Kf, Pf));

    // 蹼足与踏板保持水平，只随曲柄平移
    el.nearFoot.setAttribute('transform', 'translate(' + Pn.x.toFixed(1) + ' ' + Pn.y.toFixed(1) + ')');
    el.farFoot.setAttribute('transform',  'translate(' + Pf.x.toFixed(1) + ' ' + Pf.y.toFixed(1) + ')');
    el.nearPedal.setAttribute('transform', 'translate(' + Pn.x.toFixed(1) + ' ' + Pn.y.toFixed(1) + ')');
    el.farPedal.setAttribute('transform',  'translate(' + Pf.x.toFixed(1) + ' ' + Pf.y.toFixed(1) + ')');

    // 曲柄
    el.crankNear.setAttribute('transform', 'rotate(' + deg.toFixed(2) + ')');
    el.crankFar.setAttribute('transform',  'rotate(' + (deg + 180).toFixed(2) + ')');

    // 车轮（按齿比放大转速）
    var wa = (deg * GEAR) % 360;
    el.rearWheel.setAttribute('transform',  'rotate(' + wa.toFixed(2) + ')');
    el.frontWheel.setAttribute('transform', 'rotate(' + wa.toFixed(2) + ')');
  }

  function loop(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    if (running) {
      theta += speed * (2 * Math.PI / PERIOD) * dt;
    }
    render();
    requestAnimationFrame(loop);
  }

  function applySpeed() {
    speedVal.textContent = speed.toFixed(2) + '×';
    root.style.setProperty('--road-dur',  (0.62 / speed).toFixed(3) + 's');
    root.style.setProperty('--cloud-dur', (30 / speed).toFixed(2) + 's');
    root.style.setProperty('--bob-dur',   (PERIOD / speed).toFixed(3) + 's');
  }

  function setRunning(next) {
    running = next;
    btnToggle.textContent = running ? '⏸ 暂停' : '▶ 播放';
    document.body.classList.toggle('paused', !running);
  }

  btnToggle.addEventListener('click', function () { setRunning(!running); });
  btnReset.addEventListener('click', function () { theta = 0; render(); });
  range.addEventListener('input', function () {
    speed = parseFloat(range.value);
    applySpeed();
  });

  // 尊重系统的"减少动态效果"偏好
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { setRunning(false); }

  applySpeed();
  setRunning(running);
  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
